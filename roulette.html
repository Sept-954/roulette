<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <title>俄罗斯轮盘</title>
  <style>
:root {
  --bg: #101310;
  --surface: #171b17;
  --surface-raised: #20251f;
  --surface-soft: #1c211c;
  --line: #333a32;
  --line-strong: #465044;
  --ink: #f0eadc;
  --ink-soft: #c4c2b6;
  --muted: #858d80;
  --brass: #c69a4b;
  --brass-bright: #e0ba70;
  --teal: #57bea7;
  --teal-deep: #1f6f62;
  --red: #d84f40;
  --red-bright: #f06a56;
  --ivory: #e7dfcd;
  --header-height: 72px;
  --radius: 10px;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-width: 320px;
  height: 100%;
  background: var(--bg);
}

body {
  min-width: 320px;
  height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(circle at 72% 38%, rgba(87, 190, 167, 0.08), transparent 34%),
    radial-gradient(circle at 18% 86%, rgba(198, 154, 75, 0.08), transparent 29%),
    linear-gradient(145deg, #151914 0%, var(--bg) 56%, #0d100e 100%);
  color: var(--ink);
  font-family: "Bahnschrift", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--brass-bright);
  outline-offset: 3px;
}

.app-shell {
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: var(--header-height) minmax(0, 1fr);
  position: relative;
}

.app-shell::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.22;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: linear-gradient(to bottom, black, transparent 72%);
}

.topbar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: rgba(16, 19, 16, 0.86);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.brand-mark {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: linear-gradient(145deg, #272d26, #141814);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  color: var(--brass);
}

.brand-mark svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.35;
}

.brand-mark circle:not(:first-child) {
  fill: var(--brass);
  stroke: none;
}

.brand-mark .brand-pin {
  fill: var(--ink);
}

.brand-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-copy strong {
  overflow: hidden;
  font-size: 18px;
  font-weight: 720;
  letter-spacing: 0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-copy small {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
}

.round-indicator {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-left: 16px;
  border-left: 1px solid var(--line);
}

.round-indicator span {
  color: var(--muted);
  font-size: 12px;
}

.round-indicator strong {
  color: var(--brass-bright);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.workspace {
  position: relative;
  z-index: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(220px, 272px) minmax(420px, 1fr) minmax(260px, 310px);
  background: rgba(18, 22, 18, 0.42);
}

.stats-panel,
.control-panel {
  min-width: 0;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
  background: rgba(22, 26, 22, 0.72);
}

.stats-panel {
  display: flex;
  flex-direction: column;
  padding: 26px 24px 22px;
  border-right: 1px solid var(--line);
}

.control-panel {
  display: flex;
  flex-direction: column;
  padding: 26px 24px 22px;
  border-left: 1px solid var(--line);
}

.control-panel > .control-section,
.control-panel > .shot-button,
.control-panel > .reload-button,
.control-panel > .model-note {
  flex-shrink: 0;
}

.panel-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.panel-heading i {
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, var(--line-strong), transparent);
}

.control-label,
.section-kicker {
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 24px;
  border-bottom: 1px solid var(--line);
  border-left: 1px solid var(--line);
}

.stat-grid > div {
  min-width: 0;
  padding: 22px 16px;
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

.stat-grid dt {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.05em;
}

.stat-grid dd {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-top: 7px;
  color: var(--ink);
  font-family: "Cascadia Mono", "Consolas", monospace;
}

.stat-grid dd span {
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stat-grid dd small {
  color: var(--muted);
  font-family: "Microsoft YaHei UI", sans-serif;
  font-size: 10px;
}

.history-block {
  min-height: 0;
  padding-top: 23px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--ink-soft);
  font-size: 12px;
}

.section-heading span:last-child {
  color: var(--muted);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 10px;
}

.history-list {
  min-height: 66px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 13px;
}

.history-chip,
.history-empty {
  height: 25px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #121612;
  color: var(--muted);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.history-chip {
  min-width: 34px;
  padding: 0 8px;
}

.history-chip.is-blank {
  border-color: rgba(87, 190, 167, 0.34);
  color: var(--teal);
}

.history-chip.is-bang {
  border-color: rgba(240, 106, 86, 0.54);
  background: rgba(216, 79, 64, 0.1);
  color: var(--red-bright);
}

.history-empty {
  padding: 0 10px;
  border-style: dashed;
}

.history-round {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(15, 18, 15, 0.56);
}

.history-round.is-current {
  border-color: rgba(198, 154, 75, 0.34);
  background: rgba(198, 154, 75, 0.035);
}

.history-round-main {
  min-width: 0;
}

.history-round-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.history-round-title {
  color: var(--ink-soft);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.history-round.is-current .history-round-title {
  color: var(--brass-bright);
}

.history-round-status {
  color: var(--muted);
  font-size: 9px;
}

.history-round-shots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.history-delete {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #121612;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease, color 140ms ease;
}

.history-delete:hover {
  border-color: rgba(240, 106, 86, 0.58);
  background: rgba(216, 79, 64, 0.1);
  color: var(--red-bright);
}

.history-delete svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.stage-panel {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(260px, 1fr) auto;
  padding: 24px 28px 22px;
  overflow: hidden;
}

.stage-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
    linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px);
  background-size: 88px 88px;
  mask-image: radial-gradient(circle at 52% 48%, black, transparent 72%);
}

.stage-topline {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: var(--muted);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.revolver-stage {
  position: relative;
  z-index: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}

.stage-glow {
  position: absolute;
  left: 50%;
  top: 52%;
  width: min(64vw, 660px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(87, 190, 167, 0.09), transparent 48%),
    radial-gradient(circle at 58% 46%, rgba(198, 154, 75, 0.08), transparent 44%);
  filter: blur(11px);
  transition: opacity 260ms ease;
  z-index: -1;
}

.revolver-stage[data-tone="blank"] .stage-glow {
  background: radial-gradient(circle, rgba(87, 190, 167, 0.17), transparent 56%);
}

.revolver-stage[data-tone="bang"] .stage-glow {
  background: radial-gradient(circle, rgba(216, 79, 64, 0.2), transparent 56%);
}

.revolver-art {
  width: min(100%, 900px);
  max-height: min(62vh, 590px);
  overflow: visible;
}

.gun-part {
  fill: url("#gun-body");
  stroke: #171b18;
  stroke-width: 3;
}

.gun-grip {
  fill: url("#grip-wood");
}

.gun-grip-panel {
  fill: #6d472f;
  stroke: rgba(231, 223, 205, 0.16);
  stroke-width: 2;
}

.gun-frame,
.gun-barrel,
.gun-underlug,
.gun-hammer,
.gun-trigger,
.gun-crown {
  stroke: #171b18;
}

.gun-highlight {
  fill: rgba(255, 255, 255, 0.22);
}

.gun-line {
  fill: none;
  stroke: rgba(236, 233, 220, 0.2);
  stroke-width: 3;
  stroke-linecap: round;
}

.gun-trigger-guard {
  fill: none;
  stroke: url("#gun-edge");
  stroke-width: 13;
  stroke-linecap: round;
}

.gun-trigger {
  fill: #4c5350;
}

.gun-screw {
  fill: #242925;
  stroke: rgba(231, 223, 205, 0.32);
  stroke-width: 1.5;
}

.cylinder-rotor {
  transform-box: view-box;
  transform-origin: 375px 220px;
}

.cylinder-rotor.is-spinning {
  animation: cylinder-spin 560ms cubic-bezier(0.32, 0.72, 0.2, 1);
}

.cylinder-rotor.is-reloading {
  animation: cylinder-reload 720ms cubic-bezier(0.22, 1, 0.36, 1);
}

.cylinder-back {
  fill: #101410;
  opacity: 0.72;
}

.cylinder-rim {
  fill: #343a36;
  stroke: #151916;
  stroke-width: 3;
}

.cylinder-face {
  fill: url("#cylinder-face");
  stroke: #202521;
  stroke-width: 2;
}

.cylinder-flutes path {
  fill: none;
  stroke: rgba(21, 25, 22, 0.42);
  stroke-width: 12;
  stroke-linecap: round;
}

.cylinder-pin-ring {
  fill: #242a26;
  stroke: rgba(236, 233, 220, 0.25);
  stroke-width: 2;
}

.cylinder-pin {
  fill: url("#cylinder-center");
  stroke: #181c19;
  stroke-width: 2;
}

.chamber-cell .chamber-seat {
  fill: #131713;
  stroke: rgba(231, 223, 205, 0.2);
  stroke-width: 2;
}

.chamber-cell .chamber-core {
  fill: #e2dbc9;
  stroke: #242a26;
  stroke-width: 2.5;
  transition: fill 160ms ease, stroke 160ms ease;
}

.chamber-cell .chamber-number {
  fill: #212620;
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 8px;
  font-weight: 800;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

.chamber-cell.is-spent .chamber-core {
  fill: #30372f;
  stroke: rgba(87, 190, 167, 0.45);
}

.chamber-cell.is-spent .chamber-number {
  fill: #788078;
}

.chamber-cell.is-hit .chamber-core {
  fill: var(--red);
  stroke: #ffb09f;
  filter: url("#soft-glow");
}

.chamber-cell.is-hit .chamber-number {
  fill: #fff5ed;
}

.result-stamp {
  position: absolute;
  top: 12%;
  right: 5%;
  z-index: 3;
  padding: 7px 12px 5px;
  border: 2px solid currentColor;
  color: var(--teal);
  font-size: clamp(18px, 2.4vw, 31px);
  font-weight: 800;
  letter-spacing: 0.14em;
  opacity: 0;
  transform: rotate(-7deg) scale(0.88);
  transition: opacity 150ms ease, transform 180ms ease;
}

.revolver-stage[data-tone="blank"] .result-stamp,
.revolver-stage[data-tone="bang"] .result-stamp {
  animation: stamp-in 760ms ease both;
}

.revolver-stage[data-tone="bang"] .result-stamp {
  color: var(--red-bright);
}

.cylinder-legend {
  position: absolute;
  left: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  color: var(--muted);
  font-size: 10px;
}

.cylinder-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.cylinder-legend i {
  width: 8px;
  height: 8px;
  display: inline-block;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 50%;
}

.legend-live {
  background: var(--ivory);
}

.legend-spent {
  background: #30372f;
}

.legend-hit {
  background: var(--red);
}

.status-console {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  gap: 13px;
  min-height: 88px;
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(19, 23, 19, 0.78);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
}

.status-lamp {
  width: 9px;
  height: 9px;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--brass);
  box-shadow: 0 0 0 5px rgba(198, 154, 75, 0.08), 0 0 18px rgba(198, 154, 75, 0.38);
}

.revolver-stage[data-tone="blank"] + .status-console .status-lamp {
  background: var(--teal);
  box-shadow: 0 0 0 5px rgba(87, 190, 167, 0.08), 0 0 18px rgba(87, 190, 167, 0.4);
}

.revolver-stage[data-tone="bang"] + .status-console .status-lamp {
  background: var(--red-bright);
  box-shadow: 0 0 0 5px rgba(216, 79, 64, 0.09), 0 0 20px rgba(216, 79, 64, 0.46);
}

.status-console strong {
  display: block;
  margin-top: 4px;
  color: var(--ivory);
  font-size: 17px;
  font-weight: 650;
}

.status-console p {
  max-width: 760px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.control-section {
  padding: 25px 0;
  border-bottom: 1px solid var(--line);
}

.control-label {
  display: block;
  margin-bottom: 12px;
}

.segmented-control {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #101410;
}

.mode-button {
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
}

.mode-button:hover {
  color: var(--ink);
}

.mode-button.is-active {
  background: var(--surface-raised);
  color: var(--ivory);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.mode-button svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mode-button span {
  font-size: 13px;
}

.interval-control {
  transition: opacity 180ms ease;
}

.interval-control.is-disabled {
  opacity: 0.42;
}

.control-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.control-label-row output {
  color: var(--brass-bright);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 12px;
  font-weight: 700;
}

.duration-picker {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 11px;
}

.duration-unit {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 9px 5px 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #101410;
}

.duration-unit input {
  width: 100%;
  min-width: 0;
  height: 36px;
  border: 0;
  border-bottom: 1px solid var(--line-strong);
  border-radius: 0;
  background: transparent;
  color: var(--ivory);
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 19px;
  font-weight: 720;
  line-height: 1;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.duration-unit input::-webkit-inner-spin-button,
.duration-unit input::-webkit-outer-spin-button {
  opacity: 0.52;
}

.duration-unit input:disabled {
  color: var(--muted);
  cursor: not-allowed;
}

.duration-unit span {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.08em;
}

.duration-hint {
  margin-top: 9px;
  color: #676f63;
  font-size: 10px;
  line-height: 1.5;
}

.shot-button {
  position: relative;
  width: min(100%, 196px);
  min-height: 176px;
  align-self: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 27px;
  overflow: hidden;
  border: 1px solid rgba(240, 106, 86, 0.42);
  border-radius: 50%;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.12), transparent 25%),
    linear-gradient(145deg, #e35b4b, #a72f27 78%);
  color: #fff7ef;
  cursor: pointer;
  box-shadow:
    0 22px 46px rgba(133, 33, 27, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.26),
    inset 0 -9px 20px rgba(74, 12, 10, 0.3);
  transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
}

.shot-button::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: inherit;
}

.shot-button:hover:not(:disabled) {
  transform: translateY(-3px);
  filter: saturate(1.06) brightness(1.04);
  box-shadow:

.shot-button:active:not(:disabled) {
  transform: translateY(1px) scale(0.985);
}

.shot-button:disabled {

  filter: grayscale(0.35) brightness(0.74);
}

.shot-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.28);

  background: rgba(46, 7, 6, 0.18);
}

.shot-icon svg {
  width: 21px;
  height: 21px;
  fill: currentColor;
}

.shot-copy {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.shot-copy small {
  color: rgba(255, 247, 239, 0.72);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.shot-copy strong {
  font-size: 18px;
  font-weight: 720;
  letter-spacing: 0.08em;
}

.shot-rail {
  position: absolute;
  left: 50%;
  bottom: 17px;
  width: 28px;
  height: 3px;
  border-radius: 3px;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.24);
}

.reload-button {
  flex: 0 0 48px;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 14px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #151915;
  color: var(--ink-soft);
  cursor: pointer;
  transition: border-color 150ms ease, background 150ms ease, color 150ms ease;

.reload-button:hover {
  border-color: var(--brass);
  background: #1e231d;
  color: var(--ivory);
}

.reload-button svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.reload-button span {
  font-size: 13px;
}

.model-note {
  margin-top: auto;
  padding-top: 24px;
}

.model-note span {
  color: var(--brass);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.model-note p {
  margin-top: 8px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;

@keyframes cylinder-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(222deg);
  }
}

@keyframes cylinder-reload {
  0% {
    transform: rotate(0deg) scale(1);
  }
  45% {
    transform: rotate(-164deg) scale(0.96);
  }
  100% {
    transform: rotate(-360deg) scale(1);
  }
}

@keyframes stamp-in {
  0% {
    opacity: 0;
    transform: rotate(-7deg) scale(1.22);
  }
  18% {
    opacity: 0.34;
    transform: rotate(-7deg) scale(0.94);
  }
  72% {
    opacity: 0.28;
  }
  100% {
    opacity: 0;
    transform: rotate(-7deg) scale(1);
  }

"use strict";

    gameState.chambers.forEach((chamber, index) => {

      const y = 220 + Math.sin(angle) * 43;

    const historyState = state.roundHistory.getState();
    refs.historyCount.textContent = `${historyState.triggerCount} 次`;

      const row = document.createElement("div");
      row.className = `history-round${round.closed ? "" : " is-current"}`;

      main.className = "history-round-main";
